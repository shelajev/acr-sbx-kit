schemaVersion: "2"
kind: mixin
name: acr
displayName: Agentic Context Registry
description: Install ACR, a package manager that materializes GitHub-hosted rules, skills, scripts, and hooks for AI coding agents.
licenses:
  - Apache-2.0

args:
  version:
    default: "0.2.1"
    description: ACR release version to install (without a leading v)
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

credentials:
  - service: acr-github
    description: Optional GitHub token for private repositories, higher API limits, and publishing ACR packages
    required: false
    provider: github
    apiKey:
      name: GH_TOKEN
      proxyManaged: true
      inject:
        - domain: api.github.com
          scheme: bearer
        - domain: codeload.github.com
          scheme: bearer
        - domain: uploads.github.com
          scheme: bearer

permissions:
  network:
    allow:
      # ACR release installation and GitHub repository links.
      - github.com
      - release-assets.githubusercontent.com
      # ACR dependency resolution, immutable source archives, release metadata,
      # and package publishing.
      - api.github.com
      - codeload.github.com
      - objects.githubusercontent.com
      - uploads.github.com

setup:
  install:
    - command: |
        set -eu
        version='${{ kit.args.version }}'
        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        asset="acr-linux-${arch}.tar.gz"
        base="https://github.com/jbaruch/agentic-context-registry/releases/download/v${version}"
        work="$(mktemp -d)"
        trap 'rm -rf "$work"' EXIT
        curl -fsSL "$base/$asset" -o "$work/$asset"
        curl -fsSL "$base/checksums.txt" -o "$work/checksums.txt"
        expected="$(awk -v name="$asset" '$2 == name { print $1 }' "$work/checksums.txt")"
        test -n "$expected"
        actual="$(sha256sum "$work/$asset" | awk '{ print $1 }')"
        test "$actual" = "$expected"
        tar -xzf "$work/$asset" -C "$work" acr
        install -m 0755 "$work/acr" /usr/local/bin/acr
        acr version
      user: "0"
      description: Download ACR for the sandbox architecture, verify its published SHA-256 checksum, and install it

agentInstructions:
  content: |
    The `acr` CLI is installed. It manages GitHub-hosted packages of agent rules,
    skills, scripts, and hooks in the current project.

    Before beginning substantive work in every session, look for `agents.yaml`
    at the project root. If it exists, run these commands from that root:

        acr install --non-interactive
        acr realize

    This is mandatory project bootstrap: it reconciles the declared ACR
    dependencies and materializes their locked rules, skills, scripts, and
    hooks for the selected agents. If either command fails, report the failure
    and its recovery guidance to the user instead of silently proceeding with
    incomplete agent context.

    After realization, reread the active project instruction file, such as
    `AGENTS.md` or `CLAUDE.md`, before continuing. Use newly materialized skills
    when relevant. Some agents discover new skills or session-start hooks only
    when a new session begins; if that applies, tell the user a restart is
    required for the new capability to become active.

    In a project without `agents.yaml`, do not initialize ACR automatically.
    When the user asks to add an ACR package, start with
    `acr install github:OWNER/REPO`. Avoid an interactive setup prompt by
    supplying one or more supported agents (`--agent claude-code`, `--agent
    codex`, or `--agent cursor`), a freshness policy such as `--freshness
    outdated`, and `--non-interactive`. Then run `acr realize`.

    ACR writes `agents.yaml`, `.agents/registry.lock`, and agent-specific files
    into the workspace. Inspect those changes before committing them. Run
    `acr help COMMAND` for command-specific options.
